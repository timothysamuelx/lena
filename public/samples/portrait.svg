      <stop offset="0" stop-color="#dcd7cd"/>
      <stop offset="1" stop-color="#c2bbae"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#f3eee5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f3eee5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweater" x1="0" y1="0" x2="0" y2="1">
